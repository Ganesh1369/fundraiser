<div class="admin-layout">
    <!-- Mobile top bar — only shown below 768px, where the sidebar becomes a drawer. -->
    <header class="mobile-topbar">
        <button class="menu-toggle" type="button" aria-label="Open menu" (click)="menuOpen = true">
            <lucide-icon name="menu" class="w-5 h-5"></lucide-icon>
        </button>
        <a routerLink="/" class="mobile-logo">
            <img src="/ice_logo.svg" alt="ICE">
        </a>
        <span class="admin-badge">Admin</span>
    </header>

    <div class="sidebar-backdrop" *ngIf="menuOpen" (click)="menuOpen = false"></div>

    <!-- Sidebar -->
    <aside class="sidebar dark" [class.open]="menuOpen">
        <div class="sidebar-header">
            <a routerLink="/" class="logo">
                <img src="/ice_logo.svg" alt="ICE" class="h-6">
                <span class="logo-text"><span class="text-gold"> Portal</span></span>
            </a>
            <span class="admin-badge">Admin</span>
            <button class="menu-close" type="button" aria-label="Close menu" (click)="menuOpen = false">
                <lucide-icon name="x" class="w-5 h-5"></lucide-icon>
            </button>
        </div>

        <nav class="sidebar-nav" (click)="menuOpen = false">
            <a class="nav-item" routerLink="/admin/dashboard" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">
                <lucide-icon name="bar-chart-3" class="nav-icon w-4 h-4"></lucide-icon>
                Dashboard
            </a>
            <a class="nav-item" routerLink="/admin/projects" routerLinkActive="active">
                <lucide-icon name="folder" class="nav-icon w-4 h-4"></lucide-icon>
                Projects
            </a>
            <a class="nav-item" routerLink="/admin/events" routerLinkActive="active">
                <lucide-icon name="calendar" class="nav-icon w-4 h-4"></lucide-icon>
                Events
            </a>
            <a class="nav-item" routerLink="/admin/registrations" routerLinkActive="active">
                <lucide-icon name="users" class="nav-icon w-4 h-4"></lucide-icon>
                Registrations
            </a>
            <a class="nav-item" routerLink="/admin/referrals" routerLinkActive="active">
                <lucide-icon name="share-2" class="nav-icon w-4 h-4"></lucide-icon>
                Referrals
            </a>
            <a class="nav-item" routerLink="/admin/donations" routerLinkActive="active">
                <lucide-icon name="wallet" class="nav-icon w-4 h-4"></lucide-icon>
                Donations
            </a>
            <a class="nav-item" routerLink="/admin/leaderboard" routerLinkActive="active">
                <lucide-icon name="trophy" class="nav-icon w-4 h-4"></lucide-icon>
                Leaderboard
            </a>
            <a class="nav-item" routerLink="/admin/notifications" routerLinkActive="active">
                <lucide-icon name="bell" class="nav-icon w-4 h-4"></lucide-icon>
                Notifications
            </a>
            <a class="nav-item" routerLink="/admin/share-leads" routerLinkActive="active">
                <lucide-icon name="user-plus" class="nav-icon w-4 h-4"></lucide-icon>
                Share Leads
            </a>
            <a class="nav-item" routerLink="/admin/certificates" routerLinkActive="active">
                <lucide-icon name="file-text" class="nav-icon w-4 h-4"></lucide-icon>
                Certificates
            </a>
            <a class="nav-item" routerLink="/admin/settings" routerLinkActive="active">
                <lucide-icon name="settings" class="nav-icon w-4 h-4"></lucide-icon>
                Organization
            </a>

            <!-- Separates the core fundraising screens above from the partnership modules below. -->
            <hr class="nav-divider">

            <a class="nav-item" routerLink="/admin/csr-enquiries" routerLinkActive="active">
                <lucide-icon name="handshake" class="nav-icon w-4 h-4"></lucide-icon>
                CSR
            </a>
            <a class="nav-item" routerLink="/admin/volunteers" routerLinkActive="active">
                <lucide-icon name="users" class="nav-icon w-4 h-4"></lucide-icon>
                Volunteers
            </a>
        </nav>

        <div class="sidebar-footer">
            <button class="logout-btn" (click)="logout()">
                <lucide-icon name="log-out" class="w-4 h-4"></lucide-icon>
                Logout
            </button>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
        <router-outlet></router-outlet>
    </main>
</div>
